<main id="keymgr-management" class="km-panel">
  <header class="km-header">
    <div><h1>API Key 管理</h1><p class="km-muted">sub2api / 每 Key 独立用户 / 金额 ¥ / 时间 Asia/Shanghai</p></div>
    <button id="km-refresh" type="button">刷新数据</button>
  </header>
  <p id="km-account" class="km-muted">读取管理员信息…</p>
  <p id="km-notice" class="km-notice" role="status" aria-live="polite"></p>

  <section class="km-section" aria-labelledby="km-create-title">
    <h2 id="km-create-title">批量创建</h2>
    <div id="km-resume-section" class="km-resume" hidden>
      <label for="km-resume-select">未完成批次</label>
      <select id="km-resume-select"></select>
      <button id="km-resume" type="button">继续此批次</button>
      <p class="km-muted">页面刷新后可从这里继续，复用已保存的批次参数和编号，避免重复创建用户或充值。</p>
    </div>
    <form id="km-create" class="km-form" autocomplete="off">
      <label>名称前缀<input id="km-prefix" type="text" value="key" maxlength="70" required></label>
      <label>数量<input id="km-count" type="number" value="1" min="1" max="100" step="1" required></label>
      <label>绑定分组<select id="km-create-group" required><option value="">读取分组…</option></select></label>
      <label>初始余额 / ¥<input id="km-create-quota" type="number" value="0" min="0" step="0.00000001" required><span class="km-muted">每个 Key 对应独立用户的钱包初始余额</span></label>
      <label>到期时间（北京时间）<input id="km-create-expiry" type="datetime-local" step="60"></label>
      <label class="km-check"><input id="km-create-never" type="checkbox" checked>永不过期</label>
      <label id="km-create-concurrency-field">每个 Key 并发上限<input id="km-create-concurrency" type="number" value="1" min="1" max="10000" step="1" required><span class="km-muted">由独立承载用户的原生并发限制执行</span></label>
      <div class="km-actions"><button id="km-create-submit" type="submit">创建</button></div>
    </form>
    <p id="km-batch-message" role="status" aria-live="polite">尚未创建。</p>
    <div id="km-batch-actions" class="km-actions" hidden>
      <button id="km-retry" type="button">重试同一批请求</button>
      <button id="km-copy-batch" type="button">复制本批 Key</button>
      <button id="km-download-batch" type="button">下载本批 CSV</button>
      <button id="km-clear-batch" type="button">清空本批结果</button>
    </div>
    <p id="km-retry-note" class="km-muted" hidden>重试复用上次编号和参数，不采用当前表单值；用于处理响应中断等不确定结果。</p>
    <div id="km-batch-results" class="km-scroll" hidden></div>
  </section>

  <section class="km-section" aria-labelledby="km-list-title">
    <h2 id="km-list-title">已有 Key</h2>
    <form id="km-search" class="km-search" autocomplete="off">
      <label for="km-search-input">名称 / ID / 完整 Key</label>
      <input id="km-search-input" type="text" autocomplete="off" spellcheck="false" maxlength="128" placeholder="输入后查询；不写入 URL">
      <label for="km-status">状态</label>
      <select id="km-status"><option value="">全部</option><option value="active">正常</option><option value="inactive">停用</option><option value="expired">已过期</option><option value="quota_exhausted">额度耗尽</option></select>
      <button type="submit">查询</button><button id="km-clear-search" type="button">清除筛选</button>
    </form>
    <p id="km-list-message" role="status" aria-live="polite">读取 Key…</p>
    <div class="km-scroll">
      <table class="km-table"><thead><tr><th>ID / 名称</th><th>分组</th><th>状态</th><th>余额 ¥ / 并发</th><th>到期时间</th><th>Key</th><th>操作</th></tr></thead><tbody id="km-key-rows"></tbody></table>
    </div>
    <div class="km-actions"><button id="km-prev" type="button">上一页</button><span id="km-page">第 1 页</span><button id="km-next" type="button">下一页</button></div>
  </section>

  <section id="km-edit-section" class="km-section" aria-labelledby="km-edit-title" hidden>
    <h2 id="km-edit-title">修改 Key</h2>
    <p id="km-edit-identity"></p>
    <form id="km-edit" class="km-form" autocomplete="off">
      <label>绑定分组<select id="km-edit-group"><option value="keep">保持当前分组</option></select></label>
      <label>余额操作<select id="km-edit-balance-mode"><option value="add">增加余额</option><option value="subtract">扣减余额</option><option value="set">设置为指定余额</option></select><span class="km-muted">增加 / 扣减使用差额；设置将钱包余额改为输入值</span></label>
      <label>余额变更金额 / ¥<input id="km-edit-balance-amount" type="number" min="0" step="0.00000001" placeholder="留空则不修改余额"><span class="km-muted">金额必须非负；设置为 0 可清空余额</span></label>
      <label>到期时间（北京时间）<input id="km-edit-expiry" type="datetime-local" step="60"></label>
      <label class="km-check"><input id="km-edit-never" type="checkbox">永不过期</label>
      <label>启用状态<select id="km-edit-status"><option value="keep">保持原状态</option><option value="active">启用</option><option value="inactive">停用</option></select></label>
      <label id="km-edit-concurrency-field">Key 并发上限<input id="km-edit-concurrency" type="number" min="1" max="10000" step="1" required><span class="km-muted">修改此 Key 承载用户的原生并发上限</span></label>
      <div class="km-actions"><button id="km-edit-submit" type="submit">保存修改</button><button id="km-edit-cancel" type="button">取消</button></div>
    </form>
    <p id="km-edit-message" role="status" aria-live="polite"></p>
  </section>

</main>
